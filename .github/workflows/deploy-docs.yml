name: Deploy static docs

# docs/** is excluded here on purpose: this workflow's own auto-commit step
# only ever touches docs/, so excluding it stops that commit from
# re-triggering this workflow (which would otherwise loop forever).
on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, curl, dom, fileinfo
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare .env
        run: |
          [ -f .env ] || cp .env.example .env
          php artisan key:generate --force

      - name: Regenerate /docs
        run: bash scripts/build-docs.sh

      - name: Commit and push /docs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git status --porcelain docs | grep -q .; then
            git add docs
            git commit -m "chore: regenerate static docs [skip ci]"
            git push
          else
            echo "docs/ is already up to date — nothing to commit."
          fi
