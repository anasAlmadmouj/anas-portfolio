<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anas Almadmouj — Senior Flutter Developer</title>
    <noscript><meta http-equiv="refresh" content="0; url=en/index.html"></noscript>
    <script>
        (function () {
            var supported = ['en', 'ar'];
            var preferred = null;
            var langs = navigator.languages || [navigator.language || navigator.userLanguage];
            for (var i = 0; i < langs.length; i++) {
                var code = (langs[i] || '').toLowerCase().split('-')[0];
                if (supported.indexOf(code) !== -1) {
                    preferred = code;
                    break;
                }
            }
            window.location.replace((preferred || 'en') + '/index.html');
        })();
    </script>
</head>
<body></body>
</html>
